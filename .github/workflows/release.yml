# ============================================================
# Release workflow — triggered only by v-tag pushes
# Builds for 5 targets: Linux x86_64 / Linux arm64 / macOS arm64 / Windows x86_64 / Windows arm64
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build matrix — each target runs in parallel
  # ------------------------------------------------------------------
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_suffix: x86_64-linux-gnu
            pkg_type: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_suffix: aarch64-linux-gnu
            pkg_type: tar.gz
            cross_compiler: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar

          # ── macOS ──────────────────────────────────────────
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_suffix: aarch64-macos
            pkg_type: tar.gz

          # ── Windows ────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_suffix: x86_64-windows
            pkg_type: exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            pkg_suffix: aarch64-windows
            pkg_type: exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install cross-compiler (Linux ARM64 only) ──────────
      - name: Install cross-compiler
        if: matrix.cross_compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_compiler }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # ── Set linker for cross-compilation ───────────────────
      - name: Configure linker (cross-compile)
        if: matrix.cc
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.cc }}"
          EOF

      # ── Build ──────────────────────────────────────────────
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ""

      # ── Package ────────────────────────────────────────────
      - name: Package (tar.gz)
        if: matrix.pkg_type == 'tar.gz'
        shell: bash
        run: |
          BIN="collpasswd-${{ github.ref_name }}-${{ matrix.pkg_suffix }}"
          cp "target/${{ matrix.target }}/release/collpasswd"  "$BIN"
          tar czf "$BIN.tar.gz" "$BIN"

      - name: Package (exe)
        if: matrix.pkg_type == 'exe'
        shell: bash
        run: |
          BIN="collpasswd-${{ github.ref_name }}-${{ matrix.pkg_suffix }}.exe"
          cp "target/${{ matrix.target }}/release/collpasswd.exe"  "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: collpasswd-${{ github.ref_name }}-${{ matrix.pkg_suffix }}.*

  # ------------------------------------------------------------------
  # Release — runs after ALL matrix jobs succeed
  # ------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts/

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*
